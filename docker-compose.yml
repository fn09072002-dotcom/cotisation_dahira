services:
  db:
    image: mysql:8.0
    container_name: cotisations_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: gestion_cotisations
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema_cotisations.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cotisations_app
    restart: always
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/html
      - ./.env:/var/www/.env
      - ./app:/var/www/app
      - ./vendor:/var/www/vendor
      - ./config:/var/www/config
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cotisations_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: changeme
    ports:
      - "8091:80"
    depends_on:
      - db

volumes:
  db_data: